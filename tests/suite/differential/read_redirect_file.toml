[test]
name = "read-loop-redirect-file"
tags = ["control-flow", "read", "redirection", "differential", "P0"]
tier = "P0"
class = "compat-bash"
stage = "differential"
requires = ["while", "read", "printf"]

[input]
script = "printf '1\n2\n3\n' > f.txt\nwhile read x; do echo got:$x; done < f.txt"

[expect]
status = 0
stdout = "got:1\ngot:2\ngot:3\n"

[oracle]
compare = true
shells = ["bash"]
