[test]
name = "deep-nesting-is-a-clean-error-not-a-crash"
tags = ["parser", "robustness", "security", "differential", "P0"]
tier = "P0"
class = "compat-bash"
stage = "differential"
requires = ["if", "echo"]

# Recursive-descent parsing must not overflow the stack on deeply nested input;
# in the WASM build a stack overflow is an uncatchable trap that also poisons
# the shell instance. The error text differs from bash, so only the status and
# the absence of a crash are asserted, plus the fact that the shell keeps
# running. `ignore_stderr` keeps the oracle from comparing the message.
[input]
script = """
i=0
s=""
while [ $i -lt 40 ]; do s="$s if true; then"; i=$((i+1)); done
echo ok
"""

[expect]
status = 0
stdout = "ok\n"

[oracle]
compare = true
shells = ["bash"]
ignore_stderr = true
