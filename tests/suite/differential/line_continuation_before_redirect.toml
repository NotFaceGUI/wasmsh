[test]
name = "line-continuation-before-redirect"
tags = ["lexer", "backslash-escape", "redirection", "differential", "P0"]
tier = "P0"
class = "compat-bash"
stage = "differential"
requires = ["backslash-escape", "redirection", "cat"]

[input]
# Relative paths: the oracle runs in an isolated temp dir and wasmsh in its
# own VFS cwd, so neither touches the host root.
script = "printf 'hello\\n' > in.txt\ncat in.txt \\\n  > out.txt\ncat out.txt"

[expect]
status = 0
stdout = "hello\n"

[oracle]
compare = true
shells = ["bash"]
