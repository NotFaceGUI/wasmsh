[test]
name = "param-substring-not-shadowed"
tags = ["expansion", "parameter-substring", "differential", "P1"]
tier = "P1"
class = "compat-bash"
stage = "differential"
requires = ["parameter-substring", "echo"]

[input]
script = "V=hello\necho [${V:1}]\necho [${V:1:3}]"

[expect]
status = 0
stdout = "[ello]\n[ell]\n"

[oracle]
compare = true
shells = ["bash"]
