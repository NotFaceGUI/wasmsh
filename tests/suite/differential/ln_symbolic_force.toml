[test]
name = "ln-symbolic-force-replaces"
tags = ["utility", "ln", "differential", "P1"]
tier = "P1"
class = "compat-bash"
stage = "differential"
requires = ["ln", "readlink", "cat"]

[input]
script = "echo one > a.txt\necho two > b.txt\nln -s b.txt lnk\nln -sf a.txt lnk\nreadlink lnk\ncat lnk"

[expect]
status = 0
stdout = "a.txt\none\n"

[oracle]
compare = true
shells = ["bash"]
