[test]
name = "trap-exit-sees-exit-code"
tags = ["trap", "trap-exit", "differential", "P1"]
tier = "P1"
class = "compat-bash"
stage = "differential"
requires = ["trap", "trap-exit", "exit", "echo"]

[input]
script = "trap 'echo code=$?' EXIT\nexit 7"

[expect]
status = 7
stdout = "code=7\n"

[oracle]
compare = true
shells = ["bash"]
