tags = ["arithmetic", "parameter-expansion", "positional", "differential", "P0"]
tier = "P0"
class = "compat-bash"
stage = "differential"
requires = ["arithmetic-expansion", "positional-parameters", "echo"]

[input]
script = """
set -- 7 8
echo $(( $1 + 1 ))
