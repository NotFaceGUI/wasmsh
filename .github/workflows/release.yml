name: Standalone Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: standalone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-core:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      # Gate the release on the default feature set, which is what the
      # standalone artifact actually builds. Optional features are advisory
      # (see wasm-build.yml) because their Ubuntu build is unverified.
      - run: cargo test --workspace --locked
      - run: cargo test -p wasmsh-testkit --test suite_runner --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-candidate:
    name: Build release candidate
    needs: validate-core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - name: Load pinned tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source tools/standalone/versions.env
          {
            echo "node-version=$NODE_VERSION"
            echo "wasm-pack-version=$WASM_PACK_VERSION"
            echo "wasm-bindgen-version=$WASM_BINDGEN_CLI_VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node-version }}
          cache: npm
          cache-dependency-path: e2e/standalone/package-lock.json
      - name: Install pinned wasm tooling
        run: |
          binaryen_dir="$(bash tools/standalone/install-binaryen.sh "$RUNNER_TEMP/wasmsh-binaryen")"
          echo "$binaryen_dir/bin" >> "$GITHUB_PATH"
          cargo install wasm-pack --version "${{ steps.versions.outputs.wasm-pack-version }}" --locked --force
          cargo install wasm-bindgen-cli --version "${{ steps.versions.outputs.wasm-bindgen-version }}" --locked --force
      - run: bash tools/standalone/build.sh dist/standalone-pkg
      - name: Package and checksum release candidate
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node tools/standalone/package.mjs dist/standalone-pkg dist/standalone
      - uses: actions/upload-artifact@v4
        with:
          name: wasmsh-release-candidate
          path: dist/standalone/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  test-final-artifacts:
    name: Verify release candidate
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Node version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source tools/standalone/versions.env
          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node-version }}
          cache: npm
          cache-dependency-path: e2e/standalone/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasmsh-release-candidate
          path: candidate
      - name: Extract and verify release candidate
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find candidate -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          mkdir -p extracted
          tar -xzf "$archive" -C extracted
          root=$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          node tools/standalone/verify-package.mjs "$root"
          (cd "$root" && sha256sum -c SHA256SUMS)
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - run: node tools/standalone/node-smoke.mjs "${{ steps.extract.outputs.root }}"
      - run: node tools/standalone/external-smoke.mjs
      - name: Install locked browser test dependencies
        working-directory: e2e/standalone
        run: npm ci
      - run: node --experimental-wasm-modules tools/standalone/bundler-smoke.mjs "${{ steps.extract.outputs.root }}"
      - name: Install pinned Chromium browser
        working-directory: e2e/standalone
        run: npx playwright install chromium --with-deps
      - name: Put verified web target in browser fixture
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          rm -rf e2e/standalone/fixture/pkg
          mkdir -p e2e/standalone/fixture/pkg
          cp -R "$ARTIFACT_ROOT/web/." e2e/standalone/fixture/pkg/
      - name: Run browser verification
        working-directory: e2e/standalone
        run: npx playwright test
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-release-browser-report
          path: |
            e2e/standalone/playwright-report/
            e2e/standalone/test-results/
          if-no-files-found: ignore
          retention-days: 7

  upload-tested-artifact:
    name: Upload tested release artifact
    needs: [test-final-artifacts, host-matrix]
    if: ${{ needs.test-final-artifacts.result == 'success' && needs.host-matrix.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasmsh-release-candidate
          path: candidate
      - uses: actions/upload-artifact@v4
        with:
          name: wasmsh-standalone-release
          path: candidate/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  host-matrix:
    name: Release host consumption (${{ matrix.os }})
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Node version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source tools/standalone/versions.env
          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wasmsh-release-candidate
          path: candidate
      - name: Extract and verify the shared release candidate
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find candidate -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          mkdir -p extracted
          tar -xzf "$archive" -C extracted
          root=$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          node tools/standalone/verify-package.mjs "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Run Node, clock, network, external, isolation, and cancellation smoke
        run: node tools/standalone/node-smoke.mjs "${{ steps.extract.outputs.root }}"
      - name: Run native external host smoke
        run: node tools/standalone/external-smoke.mjs
      - name: Install locked bundler smoke dependency
        working-directory: e2e/standalone
        run: npm ci --ignore-scripts
      - name: Run bundler consumer smoke
        run: node --experimental-wasm-modules tools/standalone/bundler-smoke.mjs "${{ steps.extract.outputs.root }}"

  github-release:
    name: Publish standalone GitHub Release
    needs: [test-final-artifacts, host-matrix]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.test-final-artifacts.result == 'success' && needs.host-matrix.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasmsh-release-candidate
          path: release
      - name: Create release from tested archive
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.tar.gz
          draft: false
          prerelease: false
