name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Unit and integration tests
        run: cargo test --workspace --all-features --locked
      - name: Shell compatibility suite
        run: cargo test -p wasmsh-testkit --test suite_runner --locked
      - name: Doc tests
        run: cargo test --doc --workspace --all-features --locked

  clippy:
    name: clippy native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  wasm-check:
    name: wasm32 check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Clippy wasm32 crates
        run: >
          cargo clippy --target wasm32-unknown-unknown --locked
          -p wasmsh-ast
          -p wasmsh-lex
          -p wasmsh-parse
          -p wasmsh-expand
          -p wasmsh-hir
          -p wasmsh-ir
          -p wasmsh-state
          -p wasmsh-fs
          -p wasmsh-builtins
          -p wasmsh-utils
          -p wasmsh-vm
          -p wasmsh-protocol
          -p wasmsh-browser
          -- -D warnings
      - name: Build browser crate for wasm32
        run: cargo build --target wasm32-unknown-unknown --profile dist -p wasmsh-browser --locked

  ci-pass:
    name: CI passed
    if: always()
    needs: [fmt, test, clippy, wasm-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every core check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          for result in $RESULTS; do
            test "$result" = success || {
              echo "A required CI job did not pass: $result" >&2
              exit 1
            }
          done
