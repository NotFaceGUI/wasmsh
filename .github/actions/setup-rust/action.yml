name: Setup Rust toolchain
description: >-
  Install the exact Rust toolchain selected by rust-toolchain.toml. The
  primary workflows run on GitHub-hosted runners, whose system compiler
  dependencies are part of the runner image; this action does not install a
  second system toolchain or an Emscripten target.

inputs:
  toolchain:
    description: >-
      Rust toolchain to install.  Defaults to the channel pinned in
      rust-toolchain.toml; pass a value only to deliberately build with
      a different compiler than the repo pin (e.g. the MSRV job).
    required: false
    default: ""
  targets:
    description: Comma-separated list of additional rustup targets.
    required: false
    default: ""
  components:
    description: Comma-separated list of additional rustup components.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve toolchain channel
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        channel='${{ inputs.toolchain }}'
        source='the workflow'
        if [ -z "$channel" ]; then
          # Single source of truth. Fail loudly rather than silently
          # falling back to `stable` — a floating compiler is exactly the
          # drift this indirection exists to prevent.
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            rust-toolchain.toml | head -1)
          source='rust-toolchain.toml'
        fi
        if [ -z "$channel" ]; then
          echo "::error::no Rust toolchain given and none found in rust-toolchain.toml" >&2
          exit 1
        fi
        echo "Using Rust toolchain '$channel' (from $source)"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.resolve.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
