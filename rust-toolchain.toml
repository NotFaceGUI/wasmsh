[toolchain]
# Pinned to an exact release, not "stable".
#
# The standalone sh build only targets wasm32-unknown-unknown. Pyodide keeps
# its source and legacy build entry points, but it must not be installed as a
# default dependency of the primary toolchain.
#
# Known good: 1.95.0. Keep this pin synchronized with CI and standalone
# build-manifest output before changing it.
channel = "1.95.0"
components = [
    "rustfmt",
    "clippy",
]
targets = [
    "wasm32-unknown-unknown",
]
